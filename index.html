<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <!--
    iOS Safari では viewport の設定が特に重要。
    user-scalable=no でピンチズームを防ぎ、
    viewport-fit=cover でノッチ付き端末にも対応する。
  -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <!-- iOS ホーム画面追加時にフルスクリーン動作させる -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>VOID RUNNER - 2D Dodge Game</title>
  <style>
    /* ===== グローバルリセット & 基本スタイル ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    html {
      /* iOS Safari では 100vh がアドレスバー分ずれるので height:100% を使う */
      height: 100%;
    }

    body {
      background-color: #020b18;
      color: #00ffcc;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      /* iOS ノッチ対応の安全領域 */
      padding-top: env(safe-area-inset-top, 8px);
      padding-bottom: env(safe-area-inset-bottom, 8px);
      /* スクロールは body でのみ制御（overflow: hidden を html に入れない） */
      overflow: hidden;
      /* iOS Safari でのバウンススクロール防止 */
      overscroll-behavior: none;
    }

    /* ===== タイトル ===== */
    h1 {
      font-size: clamp(1rem, 5vw, 1.8rem); /* 画面幅に応じて可変 */
      letter-spacing: 0.3em;
      text-shadow: 0 0 10px #00ffcc, 0 0 30px #00ffcc;
      margin: 6px 0 4px;
    }

    /* ===== スコア表示 ===== */
    #hud {
      display: flex;
      gap: 32px;
      margin-bottom: 6px;
      font-size: clamp(0.7rem, 3.5vw, 0.95rem);
      letter-spacing: 0.12em;
    }

    #hud span {
      text-shadow: 0 0 6px #00ffcc;
    }

    /* ===== ゲームキャンバス ===== */
    #gameCanvas {
      border: 2px solid #00ffcc;
      box-shadow: 0 0 20px #00ffcc55, 0 0 60px #00ffcc22;
      background-color: #020b18;
      display: block;
      /* JS でサイズを動的に決定するので CSS での width/height は指定しない */
      /* キャンバス上のタッチはスクロールさせない */
      touch-action: none;
    }

    /* ===== バーチャルジョイスティック エリア ===== */
    #joystickArea {
      position: relative;
      width: 160px;
      height: 160px;
      margin-top: 14px;
      flex-shrink: 0;
      /* ジョイスティック上のタッチもスクロールさせない */
      touch-action: none;
    }

    /* 外側リング */
    /* inset: 0 は Safari 14以前で非対応なので top/right/bottom/left に展開 */
    #joystickBase {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      border-radius: 50%;
      border: 2px solid #00ffcc44;
      background: #00ffcc0a;
    }

    /* スティック（動く円） */
    #joystickKnob {
      position: absolute;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #00ffcc33;
      border: 2px solid #00ffcc;
      box-shadow: 0 0 12px #00ffcc88;
      /* 中央に配置 */
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      transition: none; /* 指を追随するので transition は不要 */
    }

    /* ===== オーバーレイ（スタート／ゲームオーバー画面）===== */
    /* inset: 0 は Safari 14以前で非対応なので top/right/bottom/left に展開 */
    #overlay {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      display: -webkit-flex; /* Safari 古いバージョン向け */
      display: flex;
      -webkit-flex-direction: column;
      flex-direction: column;
      -webkit-align-items: center;
      align-items: center;
      -webkit-justify-content: center;
      justify-content: center;
      gap: 14px;
      background: #020b18cc;
      /* キャンバスの上に重ねる */
      z-index: 10;
    }

    #overlay h2 {
      font-size: clamp(1.4rem, 7vw, 2.4rem);
      letter-spacing: 0.2em;
      text-shadow: 0 0 15px #ff004c, 0 0 40px #ff004c;
      color: #ff004c;
    }

    #overlay p {
      font-size: clamp(0.75rem, 3.5vw, 1rem);
      letter-spacing: 0.08em;
      color: #aaffee;
      text-shadow: 0 0 6px #00ffcc;
      text-align: center;
      padding: 0 20px;
    }

    #overlay button {
      margin-top: 8px;
      padding: 14px 44px;
      background: transparent;
      border: 2px solid #00ffcc;
      color: #00ffcc;
      font-family: 'Courier New', Courier, monospace;
      font-size: clamp(0.9rem, 4vw, 1.1rem);
      letter-spacing: 0.2em;
      cursor: pointer;
      text-shadow: 0 0 6px #00ffcc;
      box-shadow: 0 0 12px #00ffcc55;
      /* タップ時のフィードバック */
      transition: background 0.15s, box-shadow 0.15s;
    }

    #overlay button:active {
      background: #00ffcc33;
      box-shadow: 0 0 28px #00ffccaa;
    }

    .hidden {
      display: none !important;
    }

    /* ===== 操作説明（キーボードとタッチ両方を案内）===== */
    #instructions {
      margin-top: 8px;
      font-size: clamp(0.6rem, 2.8vw, 0.75rem);
      color: #335544;
      letter-spacing: 0.06em;
      text-align: center;
    }

    /* ===== キャンバスとオーバーレイを包むラッパー ===== */
    #gameWrapper {
      position: relative; /* overlay の position: absolute の基点 */
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <h1>⚡ VOID RUNNER ⚡</h1>

  <!-- スコア / ハイスコア 表示エリア -->
  <div id="hud">
    <span>SCORE: <span id="scoreDisplay">0</span></span>
    <span>BEST: <span id="bestDisplay">0</span></span>
  </div>

  <!-- キャンバスとオーバーレイをまとめるラッパー -->
  <div id="gameWrapper">
    <canvas id="gameCanvas"></canvas>

    <!-- スタート／ゲームオーバー用オーバーレイ -->
    <div id="overlay">
      <h2 id="overlayTitle">VOID RUNNER</h2>
      <p id="overlayMessage">WASDキー または 画面下のジョイスティックで移動して敵を避けろ！</p>
      <p id="finalScore" class="hidden"></p>
      <button id="startBtn" onclick="startGame()">[ START ]</button>
    </div>
  </div>

  <!-- バーチャルジョイスティック（タッチ操作用） -->
  <div id="joystickArea">
    <div id="joystickBase"></div>
    <div id="joystickKnob"></div>
  </div>

  <p id="instructions">WASD: 移動（キーボード）&nbsp;|&nbsp; 下のジョイスティック（タッチ）</p>

  <script>
    // ============================================================
    //  定数・設定
    // ============================================================

    const LOGICAL_W = 600;      // 論理キャンバス幅（ゲーム内座標系）
    const LOGICAL_H = 500;      // 論理キャンバス高さ
    const PLAYER_SIZE = 16;     // プレイヤーの半幅（正方形）
    const PLAYER_SPEED = 3;     // プレイヤーの移動速度（px/フレーム）
    const ENEMY_SIZE = 14;      // 敵の半幅
    const ENEMY_BASE_SPEED = 1.5;
    const ENEMY_SPAWN_INTERVAL = 90;
    const MAX_ENEMIES = 30;

    // ============================================================
    //  キャンバスのレスポンシブ対応
    //  論理座標（600×500）を維持したまま、画面サイズに合わせてスケール
    // ============================================================

    const canvas  = document.getElementById('gameCanvas');
    const ctx     = canvas.getContext('2d');
    let canvasScale = 1; // 描画スケール倍率

    function resizeCanvas() {
      // 利用可能な幅を取得（余白を考慮して少し小さめに）
      const maxW = Math.min(window.innerWidth - 8, LOGICAL_W);
      // 縦方向は HUD + ジョイスティック + タイトル の高さを引く
      const reservedH = 150; // タイトル・HUD・ジョイスティック等のための高さ
      const maxH = Math.min(window.innerHeight - reservedH, LOGICAL_H);

      // アスペクト比を保ったまま収まるスケールを計算
      canvasScale = Math.min(maxW / LOGICAL_W, maxH / LOGICAL_H);

      const displayW = Math.floor(LOGICAL_W * canvasScale);
      const displayH = Math.floor(LOGICAL_H * canvasScale);

      // CSS でのサイズ（実際の表示サイズ）
      canvas.style.width  = displayW + 'px';
      canvas.style.height = displayH + 'px';

      // canvas 属性は論理サイズ（ゲーム座標系）のまま維持
      canvas.width  = LOGICAL_W;
      canvas.height = LOGICAL_H;

      // ゲームラッパーのサイズも同期
      document.getElementById('gameWrapper').style.width  = displayW + 'px';
      document.getElementById('gameWrapper').style.height = displayH + 'px';
    }

    // 画面回転・リサイズ時にも再計算
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas(); // 初回実行

    // ============================================================
    //  変数
    // ============================================================

    let player   = {};
    let enemies  = [];
    let score    = 0;
    let bestScore = 0;
    let frameCount  = 0;
    let gameRunning = false;
    let animId      = null;

    // ============================================================
    //  キーボード入力（PCでも遊べるように維持）
    // ============================================================

    const keys = { w: false, a: false, s: false, d: false };

    document.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k in keys) keys[k] = true;
    });
    document.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (k in keys) keys[k] = false;
    });

    // ============================================================
    //  バーチャルジョイスティック（タッチ操作）
    // ============================================================

    const joystickArea = document.getElementById('joystickArea');
    const joystickKnob = document.getElementById('joystickKnob');

    // スティックの傾き量（-1.0 〜 1.0 の正規化済み値）
    let joystickDelta = { x: 0, y: 0 };

    // ジョイスティックエリアの中心を取得
    function getJoystickCenter() {
      const rect = joystickArea.getBoundingClientRect();
      return {
        cx: rect.left + rect.width / 2,
        cy: rect.top  + rect.height / 2,
        r:  rect.width / 2,  // 有効半径
      };
    }

    // スティックの見た目と joystickDelta を更新
    function updateJoystick(touchX, touchY) {
      const { cx, cy, r } = getJoystickCenter();
      const maxKnobTravel = r * 0.65; // スティックが動ける最大距離

      let dx = touchX - cx;
      let dy = touchY - cy;
      const dist = Math.sqrt(dx * dx + dy * dy);

      // 外周を超えないようにクランプ
      if (dist > maxKnobTravel) {
        dx = (dx / dist) * maxKnobTravel;
        dy = (dy / dist) * maxKnobTravel;
      }

      // CSS で位置を更新（中心からのオフセット）
      joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;

      // 正規化（-1 〜 1）
      joystickDelta.x = dx / maxKnobTravel;
      joystickDelta.y = dy / maxKnobTravel;
    }

    // スティックをリセット（中央に戻す）
    function resetJoystick() {
      joystickKnob.style.transform = 'translate(-50%, -50%)';
      joystickDelta.x = 0;
      joystickDelta.y = 0;
    }

    // ジョイスティックのタッチ開始
    joystickArea.addEventListener('touchstart', (e) => {
      e.preventDefault(); // スクロール防止
      const t = e.touches[0];
      updateJoystick(t.clientX, t.clientY);
    }, { passive: false });

    // ジョイスティックのタッチ移動
    joystickArea.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const t = e.touches[0];
      updateJoystick(t.clientX, t.clientY);
    }, { passive: false });

    // ジョイスティックのタッチ終了
    joystickArea.addEventListener('touchend',   (e) => { e.preventDefault(); resetJoystick(); }, { passive: false });
    joystickArea.addEventListener('touchcancel',(e) => { e.preventDefault(); resetJoystick(); }, { passive: false });

    // キャンバス全体のスクロール・コンテキストメニューを防ぐ
    canvas.addEventListener('touchstart',  (e) => e.preventDefault(), { passive: false });
    canvas.addEventListener('touchmove',   (e) => e.preventDefault(), { passive: false });
    document.addEventListener('contextmenu',(e) => e.preventDefault());

    // ============================================================
    //  ゲーム初期化
    // ============================================================

    function startGame() {
      document.getElementById('overlay').classList.add('hidden');

      player = { x: LOGICAL_W / 2, y: LOGICAL_H / 2 };

      enemies    = [];
      score      = 0;
      frameCount = 0;
      gameRunning = true;

      updateHUD();

      if (animId) cancelAnimationFrame(animId);
      gameLoop();
    }

    // ============================================================
    //  敵の生成
    // ============================================================

    function spawnEnemy() {
      const side = Math.floor(Math.random() * 4);
      let ex, ey;

      if      (side === 0) { ex = Math.random() * LOGICAL_W; ey = -ENEMY_SIZE; }
      else if (side === 1) { ex = LOGICAL_W + ENEMY_SIZE;    ey = Math.random() * LOGICAL_H; }
      else if (side === 2) { ex = Math.random() * LOGICAL_W; ey = LOGICAL_H + ENEMY_SIZE; }
      else                 { ex = -ENEMY_SIZE;               ey = Math.random() * LOGICAL_H; }

      const speedBonus = Math.min(score / 300, 2.5);
      const speed = ENEMY_BASE_SPEED + speedBonus + (Math.random() - 0.5) * 0.8;
      const angle = Math.atan2(player.y - ey, player.x - ex);

      enemies.push({ x: ex, y: ey, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed });
    }

    // ============================================================
    //  衝突判定（AABB）
    // ============================================================

    function checkCollision(a, aSize, b, bSize) {
      return Math.abs(a.x - b.x) < aSize + bSize &&
             Math.abs(a.y - b.y) < aSize + bSize;
    }

    // ============================================================
    //  プレイヤーの更新（キーボード + ジョイスティック）
    // ============================================================

    function updatePlayer() {
      // キーボード入力
      if (keys.w) player.y -= PLAYER_SPEED;
      if (keys.s) player.y += PLAYER_SPEED;
      if (keys.a) player.x -= PLAYER_SPEED;
      if (keys.d) player.x += PLAYER_SPEED;

      // ジョイスティック入力（キーボードと合算可能）
      // joystickDelta は -1〜1 なので PLAYER_SPEED を掛けて速度に変換
      player.x += joystickDelta.x * PLAYER_SPEED;
      player.y += joystickDelta.y * PLAYER_SPEED;

      // 画面外クランプ
      player.x = Math.max(PLAYER_SIZE, Math.min(LOGICAL_W - PLAYER_SIZE, player.x));
      player.y = Math.max(PLAYER_SIZE, Math.min(LOGICAL_H - PLAYER_SIZE, player.y));
    }

    // ============================================================
    //  敵の更新
    // ============================================================

    function updateEnemies() {
      for (const e of enemies) {
        e.x += e.vx;
        e.y += e.vy;
      }
      const margin = 100;
      enemies = enemies.filter(
        e => e.x > -margin && e.x < LOGICAL_W + margin &&
             e.y > -margin && e.y < LOGICAL_H + margin
      );
    }

    // ============================================================
    //  描画処理（論理座標で描く → CSS スケールで拡縮される）
    // ============================================================

    function draw() {
      ctx.clearRect(0, 0, LOGICAL_W, LOGICAL_H);

      // 背景
      ctx.fillStyle = '#020b18';
      ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

      // グリッドライン
      ctx.strokeStyle = '#0a2030';
      ctx.lineWidth = 1;
      for (let x = 0; x < LOGICAL_W; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, LOGICAL_H); ctx.stroke();
      }
      for (let y = 0; y < LOGICAL_H; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(LOGICAL_W, y); ctx.stroke();
      }

      // 敵を描画
      for (const e of enemies) {
        ctx.shadowColor = '#ff004c';
        ctx.shadowBlur  = 12;
        ctx.fillStyle   = '#ff004c';
        ctx.fillRect(e.x - ENEMY_SIZE, e.y - ENEMY_SIZE, ENEMY_SIZE * 2, ENEMY_SIZE * 2);
        ctx.shadowBlur  = 0;
        ctx.fillStyle   = '#ff88aa';
        ctx.fillRect(e.x - ENEMY_SIZE / 2, e.y - ENEMY_SIZE / 2, ENEMY_SIZE, ENEMY_SIZE);
      }

      // プレイヤーを描画
      ctx.shadowColor = '#00ffcc';
      ctx.shadowBlur  = 20;
      ctx.fillStyle   = '#00ffcc';
      ctx.fillRect(player.x - PLAYER_SIZE, player.y - PLAYER_SIZE, PLAYER_SIZE * 2, PLAYER_SIZE * 2);
      ctx.shadowBlur  = 0;
      ctx.fillStyle   = '#ffffff';
      ctx.fillRect(player.x - PLAYER_SIZE / 2, player.y - PLAYER_SIZE / 2, PLAYER_SIZE, PLAYER_SIZE);

      ctx.shadowBlur = 0;
    }

    // ============================================================
    //  HUD 更新
    // ============================================================

    function updateHUD() {
      document.getElementById('scoreDisplay').textContent = score;
      document.getElementById('bestDisplay').textContent  = bestScore;
    }

    // ============================================================
    //  ゲームオーバー
    // ============================================================

    function gameOver() {
      gameRunning = false;
      cancelAnimationFrame(animId);
      resetJoystick();

      if (score > bestScore) bestScore = score;
      updateHUD();

      document.getElementById('overlayTitle').textContent   = '- GAME OVER -';
      document.getElementById('overlayMessage').textContent = '敵に当たってしまった...';
      document.getElementById('finalScore').textContent     = `SCORE: ${score}`;
      document.getElementById('finalScore').classList.remove('hidden');
      document.getElementById('startBtn').textContent       = '[ RETRY ]';
      document.getElementById('overlay').classList.remove('hidden');
    }

    // ============================================================
    //  メインゲームループ
    // ============================================================

    function gameLoop() {
      if (!gameRunning) return;

      frameCount++;

      updatePlayer();

      if (frameCount % ENEMY_SPAWN_INTERVAL === 0 && enemies.length < MAX_ENEMIES) {
        spawnEnemy();
      }

      updateEnemies();

      for (const e of enemies) {
        if (checkCollision(player, PLAYER_SIZE, e, ENEMY_SIZE)) {
          gameOver();
          return;
        }
      }

      score = Math.floor(frameCount / 3);
      updateHUD();
      draw();

      animId = requestAnimationFrame(gameLoop);
    }

    // ============================================================
    //  初期描画（タイトル画面用）
    // ============================================================
    (function initialDraw() {
      ctx.fillStyle = '#020b18';
      ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
      ctx.strokeStyle = '#0a2030';
      ctx.lineWidth = 1;
      for (let x = 0; x < LOGICAL_W; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, LOGICAL_H); ctx.stroke();
      }
      for (let y = 0; y < LOGICAL_H; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(LOGICAL_W, y); ctx.stroke();
      }
    })();

  </script>
</body>
</html>
