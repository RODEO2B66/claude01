<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Dino Runner</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      height: 100%;
      background: #f7f7f7;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f7f7f7;
    }

    #gameContainer {
      position: relative;
      width: 100%;
      max-width: 800px;
      padding: 0 12px;
    }

    /* スコア表示エリア */
    #scoreArea {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 20px;
      padding: 0 4px 4px;
      font-size: clamp(14px, 3vw, 18px);
      color: #535353;
      letter-spacing: 0.1em;
      font-weight: bold;
    }

    #scoreArea span {
      font-size: 0.75em;
      color: #aaa;
    }

    /* ゲームキャンバス */
    #gameCanvas {
      display: block;
      width: 100%;
      background: #f7f7f7;
      border-bottom: 3px solid #535353;
      touch-action: none;
      cursor: pointer;
    }

    /* オーバーレイ */
    #overlay {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 10;
      pointer-events: none;
    }

    #overlayTitle {
      font-size: clamp(18px, 4vw, 28px);
      color: #535353;
      letter-spacing: 0.15em;
      font-weight: bold;
      margin-bottom: 12px;
    }

    #overlayBtn {
      display: inline-block;
      margin-top: 4px;
      padding: 10px 28px;
      border: 2px solid #535353;
      color: #535353;
      font-family: 'Courier New', Courier, monospace;
      font-size: clamp(11px, 2.5vw, 15px);
      letter-spacing: 0.15em;
      font-weight: bold;
      cursor: pointer;
      pointer-events: all;
      background: transparent;
      transition: background 0.1s;
    }

    #overlayBtn:active {
      background: #ddd;
    }

    .hidden { display: none !important; }

    /* 操作ヒント */
    #hint {
      margin-top: 10px;
      font-size: clamp(10px, 2vw, 13px);
      color: #aaa;
      letter-spacing: 0.05em;
      text-align: center;
    }

    /* 夜モード */
    body.night {
      background: #1a1a2e;
    }
    body.night #gameCanvas {
      background: #1a1a2e;
      border-bottom-color: #e0e0e0;
    }
    body.night #scoreArea { color: #e0e0e0; }
    body.night #scoreArea span { color: #888; }
    body.night #overlayTitle { color: #e0e0e0; }
    body.night #overlayBtn { border-color: #e0e0e0; color: #e0e0e0; }
    body.night #hint { color: #666; }
  </style>
</head>
<body>

  <div id="gameContainer">
    <div id="scoreArea">
      <span>HI</span><span id="hiDisplay">00000</span>
      &nbsp;<span id="scoreDisplay">00000</span>
    </div>

    <div style="position:relative;">
      <canvas id="gameCanvas"></canvas>
      <div id="overlay">
        <div id="overlayTitle" class="hidden">GAME OVER</div>
        <button id="overlayBtn" onclick="startGame()">[ START ]</button>
      </div>
    </div>

    <p id="hint">スペース / 上矢印 / タップ でジャンプ &nbsp;|&nbsp; 下矢印 / 長押し でしゃがみ</p>
  </div>

<script>
// ===== Canvas セットアップ =====
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');

const LOGICAL_W = 800;
const LOGICAL_H = 240;
const GROUND_Y  = LOGICAL_H - 30;  // 地面Y座標

canvas.width  = LOGICAL_W;
canvas.height = LOGICAL_H;

function resizeCanvas() {
  const container = document.getElementById('gameContainer');
  const w = Math.min(container.clientWidth - 24, LOGICAL_W);
  const scale = w / LOGICAL_W;
  canvas.style.width  = w + 'px';
  canvas.style.height = (LOGICAL_H * scale) + 'px';
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ===== 色定義（昼/夜で変わる） =====
let isNight = false;
const COLOR = {
  get fg()      { return isNight ? '#e0e0e0' : '#535353'; },
  get bg()      { return isNight ? '#1a1a2e' : '#f7f7f7'; },
  get ground()  { return isNight ? '#e0e0e0' : '#535353'; },
  get cloud()   { return isNight ? '#444' : '#ccc'; },
  get star()    { return '#fff'; },
  get moon()    { return '#e0e0e0'; },
};

// ===== ゲーム状態 =====
let state       = 'idle';   // 'idle' | 'playing' | 'over'
let score       = 0;
let hiScore     = 0;
let speed       = 5;        // 地面スクロール速度 (px/frame)
let frameCount  = 0;
let animId      = null;
let nightTimer  = 0;        // 夜モード切り替え用

// ===== 地面ライン =====
const GROUND_LINE_Y = GROUND_Y + 2;

// ===== 恐竜 =====
const dino = {
  x: 80,
  y: GROUND_Y,
  w: 44,
  h: 48,
  vy: 0,
  jumping: false,
  ducking: false,
  dead: false,
  legPhase: 0,   // 走りアニメ用
};

const DINO_DUCK_H = 28;
const GRAVITY     = 0.8;
const JUMP_VY     = -16;

function resetDino() {
  dino.y       = GROUND_Y;
  dino.vy      = 0;
  dino.jumping = false;
  dino.ducking = false;
  dino.dead    = false;
  dino.legPhase = 0;
}

// ===== 障害物 =====
let obstacles = [];
let nextObstacleIn = 90; // frames

const CACTUS_TYPES = [
  { w: 17, h: 35, count: 1 },
  { w: 17, h: 50, count: 1 },
  { w: 34, h: 35, count: 2 },
  { w: 51, h: 35, count: 3 },
  { w: 34, h: 50, count: 2 },
];

function spawnObstacle() {
  const minGap = Math.max(60, 200 - speed * 8);
  nextObstacleIn = Math.floor(minGap + Math.random() * 120);

  // 一定速度以上になったらプテラノドンも出現
  const canBird = speed > 8;
  const isBird  = canBird && Math.random() < 0.3;

  if (isBird) {
    // プテラノドン（飛行障害物）
    const altitudes = [GROUND_Y - 20, GROUND_Y - 50, GROUND_Y - 80];
    const birdY = altitudes[Math.floor(Math.random() * altitudes.length)];
    obstacles.push({ type: 'bird', x: LOGICAL_W + 20, y: birdY, w: 46, h: 36, wingPhase: 0 });
  } else {
    // サボテン
    const t = CACTUS_TYPES[Math.floor(Math.random() * CACTUS_TYPES.length)];
    obstacles.push({ type: 'cactus', x: LOGICAL_W + 10, y: GROUND_Y, w: t.w, h: t.h, count: t.count });
  }
}

// ===== 雲・星 =====
let clouds = [];
let stars  = [];
let moon   = { x: LOGICAL_W + 40, phase: 0 };

function initClouds() {
  clouds = [];
  for (let i = 0; i < 4; i++) {
    clouds.push({
      x: Math.random() * LOGICAL_W,
      y: 20 + Math.random() * 50,
      w: 60 + Math.random() * 60,
    });
  }
}

function initStars() {
  stars = [];
  for (let i = 0; i < 50; i++) {
    stars.push({ x: Math.random() * LOGICAL_W, y: Math.random() * (GROUND_Y - 10), r: Math.random() < 0.3 ? 1.5 : 1 });
  }
}

initClouds();
initStars();

// ===== 地面テクスチャ点 =====
let groundDots = [];
function initGround() {
  groundDots = [];
  for (let i = 0; i < 80; i++) {
    groundDots.push({ x: Math.random() * LOGICAL_W * 2, size: Math.random() < 0.3 ? 2 : 1 });
  }
}
initGround();

// ===== 入力 =====
const input = { jump: false, duck: false };
let jumpPressed = false;
let duckPressed = false;

document.addEventListener('keydown', (e) => {
  if (e.key === ' ' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (!jumpPressed) { input.jump = true; jumpPressed = true; }
    if (state === 'idle' || state === 'over') startGame();
  }
  if (e.key === 'ArrowDown') { e.preventDefault(); input.duck = true; duckPressed = true; }
});
document.addEventListener('keyup', (e) => {
  if (e.key === ' ' || e.key === 'ArrowUp') { jumpPressed = false; input.jump = false; }
  if (e.key === 'ArrowDown') { duckPressed = false; input.duck = false; }
});

// タッチ操作
let touchStartY = 0;
let touchHoldTimer = null;

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  touchStartY = e.touches[0].clientY;
  touchHoldTimer = setTimeout(() => { input.duck = true; }, 150);
  if (state === 'idle' || state === 'over') { startGame(); return; }
  if (!jumpPressed) { input.jump = true; jumpPressed = true; }
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  clearTimeout(touchHoldTimer);
  jumpPressed  = false;
  input.jump   = false;
  input.duck   = false;
}, { passive: false });

canvas.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });

// ===== ゲーム開始 =====
function startGame() {
  if (state === 'playing') return;
  state      = 'playing';
  score      = 0;
  speed      = 5;
  frameCount = 0;
  nightTimer = 0;
  isNight    = false;
  document.body.classList.remove('night');

  obstacles        = [];
  nextObstacleIn   = 90;
  initClouds();
  moon.x = LOGICAL_W + 40;
  moon.phase = 0;

  resetDino();

  document.getElementById('overlayTitle').classList.add('hidden');
  document.getElementById('overlayBtn').classList.add('hidden');
  document.getElementById('overlayBtn').textContent = '[ RETRY ]';

  if (animId) cancelAnimationFrame(animId);
  animId = requestAnimationFrame(loop);
}

// ===== ゲームオーバー =====
function triggerGameOver() {
  state = 'over';
  if (score > hiScore) hiScore = score;
  updateHUD();
  document.getElementById('overlayTitle').classList.remove('hidden');
  document.getElementById('overlayBtn').classList.remove('hidden');
}

// ===== HUD 更新 =====
function updateHUD() {
  document.getElementById('scoreDisplay').textContent = String(Math.floor(score)).padStart(5, '0');
  document.getElementById('hiDisplay').textContent    = String(hiScore).padStart(5, '0');
}

// ===== 衝突判定 =====
function hitTest(obs) {
  const margin = 6;
  const dx = obs.type === 'cactus' ? margin + 2 : margin;
  const dinoH = dino.ducking ? DINO_DUCK_H : dino.h;

  const dinoLeft   = dino.x - dino.w / 2 + dx;
  const dinoRight  = dino.x + dino.w / 2 - dx;
  const dinoTop    = dino.y - dinoH + margin;
  const dinoBottom = dino.y - margin;

  const obsLeft  = obs.x + dx;
  const obsRight = obs.x + obs.w - dx;
  const obsTop   = obs.y - obs.h + margin;
  const obsBottom = obs.y;

  return dinoLeft < obsRight && dinoRight > obsLeft &&
         dinoTop  < obsBottom && dinoBottom > obsTop;
}

// ===== 描画: 恐竜 =====
function drawDino(dead) {
  const c = COLOR.fg;
  const x = dino.x;
  const y = dino.y;
  const ph = dino.legPhase;

  ctx.fillStyle = c;

  if (dino.ducking) {
    // しゃがみ形状
    // 胴体（横長）
    ctx.fillRect(x - 22, y - 24, 44, 18);
    // 頭
    ctx.fillRect(x + 8,  y - 28, 18, 12);
    // 目
    ctx.fillStyle = COLOR.bg;
    ctx.fillRect(x + 21, y - 26, 4, 4);
    ctx.fillStyle = c;
    // 脚
    drawDinoLegs(x, y, ph, true);
    // 尻尾
    ctx.fillRect(x - 24, y - 20, 8, 6);
  } else {
    // 通常形状
    // 胴体
    ctx.fillRect(x - 18, y - 40, 36, 26);
    // 首・頭
    ctx.fillRect(x - 2,  y - 52, 22, 18);
    // 口（くちばし）
    ctx.fillRect(x + 16, y - 44, 8,  6);
    // 目
    ctx.fillStyle = COLOR.bg;
    if (dead) {
      // ×目
      ctx.fillStyle = c;
      ctx.fillRect(x + 4, y - 50, 4, 4);
      ctx.fillRect(x + 8, y - 46, 4, 4);
      ctx.fillRect(x + 4, y - 46, 4, 4);
      ctx.fillRect(x + 8, y - 50, 4, 4);
    } else {
      ctx.fillRect(x + 6, y - 48, 5, 5);
    }
    ctx.fillStyle = c;
    // 腕（小さな突起）
    ctx.fillRect(x - 2, y - 30, 10, 6);
    // 尻尾
    ctx.fillRect(x - 26, y - 36, 14, 8);
    ctx.fillRect(x - 30, y - 28, 8,  6);
    // 脚
    drawDinoLegs(x, y, ph, false);
  }
}

function drawDinoLegs(x, y, ph, ducking) {
  const c = COLOR.fg;
  ctx.fillStyle = c;
  if (ducking) {
    ctx.fillRect(x - 6,  y - 8, 8, 8);
    ctx.fillRect(x + 4,  y - 8, 8, 8);
    // 足先
    ctx.fillRect(x - 10, y - 4, 8, 4);
    ctx.fillRect(x + 8,  y - 4, 8, 4);
    return;
  }
  // 走りアニメーション（2フレーム）
  if (dino.jumping) {
    // ジャンプ中は両脚を後ろに
    ctx.fillRect(x - 12, y - 16, 8, 16);
    ctx.fillRect(x + 4,  y - 12, 8, 12);
  } else if (ph === 0) {
    // 脚A
    ctx.fillRect(x - 12, y - 14, 8, 14);
    ctx.fillRect(x + 4,  y - 10, 8, 10);
    ctx.fillRect(x - 14, y - 4,  8, 4);  // 足先
  } else {
    // 脚B
    ctx.fillRect(x - 12, y - 10, 8, 10);
    ctx.fillRect(x + 4,  y - 14, 8, 14);
    ctx.fillRect(x + 4,  y - 4,  8, 4);  // 足先
  }
}

// ===== 描画: サボテン =====
function drawCactus(obs) {
  const c = COLOR.fg;
  ctx.fillStyle = c;
  const x = obs.x;
  const y = obs.y;
  const count = obs.count;
  const baseW = 17;

  for (let i = 0; i < count; i++) {
    const cx = x + i * (baseW + 0);
    // 幹
    ctx.fillRect(cx + 5, y - obs.h, 7, obs.h);
    // トゲ上部
    ctx.fillRect(cx + 2, y - obs.h + 4, 13, 5);
    // 左腕
    if (count === 1 || i === 0) {
      ctx.fillRect(cx,     y - obs.h + 12, 5, obs.h * 0.4);
      ctx.fillRect(cx,     y - obs.h + 8,  6, 6);
    }
    // 右腕
    if (count === 1 || i === count - 1) {
      ctx.fillRect(cx + 12, y - obs.h + 12, 5, obs.h * 0.4);
      ctx.fillRect(cx + 11, y - obs.h + 8,  6, 6);
    }
  }
}

// ===== 描画: プテラノドン =====
function drawBird(obs) {
  const c = COLOR.fg;
  ctx.fillStyle = c;
  const x = obs.x;
  const y = obs.y;
  const wp = obs.wingPhase; // 0 or 1

  // 胴体
  ctx.fillRect(x + 14, y - 14, 22, 10);
  // 頭
  ctx.fillRect(x + 32, y - 20, 14, 10);
  // くちばし
  ctx.fillRect(x + 44, y - 18, 10, 4);
  // 目
  ctx.fillStyle = COLOR.bg;
  ctx.fillRect(x + 38, y - 18, 4, 4);
  ctx.fillStyle = c;

  if (wp === 0) {
    // 翼を上げた状態
    ctx.fillRect(x,     y - 26, 36, 8);
    ctx.fillRect(x + 4, y - 30, 24, 6);
  } else {
    // 翼を下げた状態
    ctx.fillRect(x,     y - 10, 36, 8);
    ctx.fillRect(x + 4, y - 6,  24, 6);
  }
}

// ===== 描画: 地面 =====
function drawGround(offset) {
  ctx.fillStyle = COLOR.ground;
  ctx.fillRect(0, GROUND_LINE_Y, LOGICAL_W, 3);
  // 石ころ
  ctx.fillStyle = COLOR.ground;
  for (const d of groundDots) {
    const rx = ((d.x - offset * 0.8) % (LOGICAL_W * 2) + LOGICAL_W * 2) % (LOGICAL_W * 2);
    if (rx < LOGICAL_W) {
      ctx.fillRect(rx, GROUND_LINE_Y + 4 + (d.size === 2 ? 0 : 2), d.size * 2, d.size);
    }
  }
}

// ===== 描画: 雲 =====
function drawClouds(offset) {
  ctx.fillStyle = COLOR.cloud;
  for (const cl of clouds) {
    const rx = ((cl.x - offset * 0.3) % (LOGICAL_W + 120) + (LOGICAL_W + 120)) % (LOGICAL_W + 120) - 60;
    const w = cl.w, h = 18;
    // 雲の形（矩形の組み合わせ）
    ctx.fillRect(rx,          cl.y,     w,       h);
    ctx.fillRect(rx + w * 0.1, cl.y - 8, w * 0.5, 10);
    ctx.fillRect(rx + w * 0.45, cl.y - 12, w * 0.4, 14);
  }
}

// ===== 描画: 夜空 =====
function drawNight(offset) {
  // 星
  for (const s of stars) {
    const rx = ((s.x - offset * 0.1) % (LOGICAL_W + 40) + (LOGICAL_W + 40)) % (LOGICAL_W + 40) - 20;
    if (rx >= 0 && rx < LOGICAL_W) {
      ctx.fillStyle = COLOR.star;
      ctx.fillRect(rx - s.r, s.y - s.r, s.r * 2, s.r * 2);
    }
  }
  // 月
  const mx = ((moon.x - offset * 0.05) % (LOGICAL_W * 3) + LOGICAL_W * 3) % (LOGICAL_W * 3);
  if (mx < LOGICAL_W + 40) {
    ctx.fillStyle = COLOR.moon;
    // 月（欠けた形）
    ctx.beginPath();
    ctx.arc(mx, 40, 20, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = isNight ? '#1a1a2e' : '#f7f7f7';
    ctx.beginPath();
    ctx.arc(mx + 8, 36, 15, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ===== 描画: スコア（キャンバス外・DOM側は更新済み） =====

// ===== メインループ =====
let scrollOffset = 0;

function loop() {
  if (state !== 'playing') return;

  frameCount++;
  scrollOffset += speed;

  // スコア更新（7フレームごとに+1）
  score = Math.floor(frameCount / 7);

  // 速度アップ（徐々に加速）
  speed = 5 + score * 0.004;
  speed = Math.min(speed, 14);

  // 夜モード切り替え（500点ごと）
  nightTimer++;
  if (nightTimer >= 700) {
    nightTimer = 0;
    isNight = !isNight;
    document.body.classList.toggle('night', isNight);
  }

  // ジャンプ
  if (input.jump && !dino.jumping && !dino.ducking) {
    dino.vy      = JUMP_VY;
    dino.jumping = true;
    input.jump   = false;
  }

  // しゃがみ
  dino.ducking = input.duck && !dino.jumping;

  // 重力
  if (dino.jumping || dino.y < GROUND_Y) {
    dino.vy += GRAVITY;
    dino.y  += dino.vy;
    if (dino.y >= GROUND_Y) {
      dino.y       = GROUND_Y;
      dino.vy      = 0;
      dino.jumping = false;
    }
  }

  // 走りアニメ
  if (!dino.jumping) {
    dino.legPhase = Math.floor(frameCount / 6) % 2;
  }

  // 障害物生成
  nextObstacleIn--;
  if (nextObstacleIn <= 0) spawnObstacle();

  // 障害物移動
  for (const obs of obstacles) {
    obs.x -= speed;
    if (obs.type === 'bird') {
      obs.wingPhase = Math.floor(frameCount / 10) % 2;
    }
  }
  obstacles = obstacles.filter(o => o.x + o.w + 10 > 0);

  // 衝突判定
  for (const obs of obstacles) {
    if (hitTest(obs)) {
      dino.dead = true;
      draw(true);
      triggerGameOver();
      return;
    }
  }

  draw(false);
  updateHUD();

  // スコア100ごとにフラッシュ演出
  if (score > 0 && score % 100 === 0 && frameCount % 7 === 0) {
    // HUD点滅（軽い演出）
    const el = document.getElementById('scoreDisplay');
    el.style.visibility = 'hidden';
    setTimeout(() => { el.style.visibility = 'visible'; }, 80);
    setTimeout(() => { el.style.visibility = 'hidden'; }, 160);
    setTimeout(() => { el.style.visibility = 'visible'; }, 240);
  }

  animId = requestAnimationFrame(loop);
}

// ===== 描画 =====
function draw(dead) {
  // 背景クリア
  ctx.fillStyle = COLOR.bg;
  ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

  if (isNight) drawNight(scrollOffset);
  drawClouds(scrollOffset);
  drawGround(scrollOffset);

  // 障害物
  for (const obs of obstacles) {
    if (obs.type === 'cactus') drawCactus(obs);
    else drawBird(obs);
  }

  // 恐竜
  drawDino(dead);
}

// ===== 初期描画 =====
(function init() {
  ctx.fillStyle = COLOR.bg;
  ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
  drawGround(0);
  drawDino(false);
  updateHUD();
})();

</script>
</body>
</html>
